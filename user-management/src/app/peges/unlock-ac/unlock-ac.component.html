<!-- Section: Design Block -->
<section class="text-center text-lg-start">

    <!-- Jumbotron -->
    <div class="container py-4">
        <div class="row g-0 align-items-center">
            <div class="col-lg-6 mb-5 mb-lg-0">
                <div class="card cascading-right bg-body-tertiary" style="
              backdrop-filter: blur(30px);
              ">
                    <div class="card-body p-5 shadow-5 text-center">
                        <h2 class="fw-bold mb-3">Unlock Account</h2>
                        <form #unlockForm="ngForm" (ngSubmit)="onUnlockAccount(unlockForm)">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <input type="email" name="email" ngModel required placeholder="Enter Your Email Id"
                                        class="form-control" />
                                    <div class="text-danger small"
                                        *ngIf="unlockForm.submitted && !unlockForm.controls['email']?.valid">
                                        Email is required.
                                    </div>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <input type="password" name="newPwd" #newPwd="ngModel" ngModel required
                                        minlength="6" placeholder="Enter Your New Password" class="form-control" />
                                    <div class="text-danger small" *ngIf="unlockForm.submitted && newPwd.invalid">
                                        New password is required (min 6 characters).
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <input type="password" name="tempPwd" ngModel required
                                        placeholder="Enter Your Temporary Password" class="form-control" />
                                    <div class="text-danger small"
                                        *ngIf="unlockForm.submitted && !unlockForm.controls['tempPwd']?.valid">
                                        Temporary password is required.
                                    </div>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <input type="password" name="confirmPwd" #confirmPwd="ngModel" ngModel required
                                        placeholder="Confirm Password" class="form-control" />
                                    <div class="text-danger small" *ngIf="unlockForm.submitted && confirmPwd.invalid">
                                        Confirm password is required.
                                    </div>
                                    <div class="text-danger small"
                                        *ngIf="unlockForm.submitted && confirmPwd.value !== newPwd.value">
                                        Passwords do not match.
                                    </div>
                                </div>
                            </div>

                            <!-- Checkbox -->
                            <div class="form-check d-flex justify-content-center mb-3">
                                <input class="form-check-input me-2" type="checkbox" value="" id="form2Example33"
                                    checked />
                                <label class="form-check-label" for="form2Example33">
                                    Subscribe to our newsletter
                                </label>
                            </div>

                            <!-- Submit button -->
                            <button type="submit" class="btn btn-primary btn-block mb-1">
                                Unlock Account
                            </button>
                            <!-- Register buttons -->
                            <div class="text-center">
                                <p>or sign up with:</p>
                                <button type="button" class="btn btn-link btn-floating mx-1">
                                    <i class="fab fa-facebook-f"></i>
                                </button>

                                <button type="button" class="btn btn-link btn-floating mx-1">
                                    <i class="fab fa-google"></i>
                                </button>

                                <button type="button" class="btn btn-link btn-floating mx-1">
                                    <i class="fab fa-twitter"></i>
                                </button>

                                <button type="button" class="btn btn-link btn-floating mx-1">
                                    <i class="fab fa-github"></i>
                                </button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>

            <div class="col-lg-6 mb-5 mb-lg-0">
                <img src="https://img.freepik.com/free-photo/abstract-cybersecurity-concept-design_23-2151841678.jpg?ga=GA1.1.1180820898.1746082211&semt=ais_hybrid&w=740"
                    class="img rounded-4 shadow-4" alt="" />
            </div>
        </div>
    </div>
    <!-- Jumbotron -->
</section>
<!-- Section: Design Block -->
